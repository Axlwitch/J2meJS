    #display-container { 
      position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; 
      width: 100vw !important; height: 100vh !important; background: radial-gradient(circle at center, #0c1527 0%, #010308 100%) !important; 
      display: flex !important; justify-content: center !important; align-items: center !important; padding: 6px !important; z-index: 9999 !important; 
    }
    
    #display { 
      position: relative !important; 
      width: 100% !important; 
      max-width: 460px !important; 
      height: 100% !important; 
      max-height: 98vh !important; 
      background: linear-gradient(135deg, 
        #1c283c 0%, 
        #0b1220 25%, 
        #182338 45%, 
        #080e1a 70%, 
        #03060c 100%) !important; 
      border-radius: 28px !important; 
      padding: 14px 14px 10px 14px !important;

      display: flex !important; 
      align-items: center !important; 
      justify-content: center !important; 
      background: #000000 !important; 
      border-radius: 12px !important; 
      padding: 3px !important; 
      min-height: 0 !important; 
      width: 100% !important; 
      overflow: hidden !important; 
      position: relative !important; 
      border: 2px solid #e6c200 !important;

      height: 100% !important;

      touch-action: none !important;

      margin-top: 10px !important; 
      padding: 8px 6px 6px 6px !important; 
      display: flex !important; 
      flex-direction: column !important; 
      align-items: center !important; 
      gap: 10px !important; 
      flex-shrink: 0 !important; 
      position: relative !important;

      font-weight: 900;

      gap: 6px !important;

      gap: 8px !important;

      cursor: pointer !important; 
      display: flex !important;

      justify-content: center !important; 
      padding: 0 !important;

      touch-action: manipulation !important; 
      position: relative !important;
      overflow: visible !important;

      border-color: rgba(255, 255, 255, 0.08) !important;
      color: #446688 !important;

        inset 0 -3px 6px rgba(255, 204, 0, 0.45) !important;

      0% { box-shadow: 0 0 25px #00e5ff, inset 0 0 12px #ffffff !important; border-color: #ffffff !important; }
      50% { box-shadow: 0 0 30px #ff0055, inset 0 0 12px #ffffff !important; border-color: #ff88aa !important; }
      100% { box-shadow: 0 0 25px #ffcc00, inset 0 0 12px #ffffff !important; border-color: #ffee88 !important; }
    }

        `;
        (document.head || document.documentElement).appendChild(style);
      }
      
      injectArialBoldFont();
      
      var pathBase = '';
      var pathDump = '';
      var pathTranslate = '';
      
      var kamusGame = {};
      var autoSaveEnabled = true;
      
      var dumpPending = {};
      var hasUnsavedDump = false;

      var sedangDiterjemahkan = {};
      var isOfflineMode = !navigator.onLine;

      window.addEventListener('online', function() { isOfflineMode = false; });
      window.addEventListener('offline', function() { isOfflineMode = true; });
      
      function initPaths() {
        if (typeof Android !== 'undefined' && typeof Android.getBasePath === 'function') {
          pathBase = Android.getBasePath();
        } else {
          pathBase = '/storage/emulated/0/HTMLTools';
        }
        pathDump = pathBase + '/dump.json';
        pathTranslate = pathBase + '/translate.json';
      }
      
      function muatSemuaKamus() {
        initPaths();
        kamusGame = {};
        try {
          if (typeof Android !== 'undefined' && typeof Android.fileExists === 'function') {
            if (Android.fileExists(pathTranslate)) {
              var isi = Android.readFile(pathTranslate);
              if (isi && isi.trim() !== '') kamusGame = JSON.parse(isi);
            }
          }
        } catch(e) {}
      }
      
      function simpanKamusTranslate() {
        try {
          if (typeof Android !== 'undefined' && typeof Android.writeFile === 'function') {
            Android.writeFile(pathTranslate, JSON.stringify(kamusGame, null, 2));
          }
        } catch(e) {}
      }

      function paksaSaveDump() {
        if (!autoSaveEnabled || !hasUnsavedDump) return;
        try {
          if (typeof Android !== 'undefined' && typeof Android.writeFile === 'function') {
            var existing = {};
            if (typeof Android !== 'undefined' && typeof Android.fileExists === 'function' && Android.fileExists(pathDump)) {
              var isi = Android.readFile(pathDump);
              if (isi && isi.trim() !== '') {
                try { existing = JSON.parse(isi); } catch(err) { existing = {}; }
              }
            }
            
            Object.assign(existing, dumpPending);
            Android.writeFile(pathDump, JSON.stringify(existing, null, 2));
            
            dumpPending = {};
            hasUnsavedDump = false;
          }
        } catch(e) {}
      }
      
      function terjemahkanViaAPI(teks) {
        if (isOfflineMode || sedangDiterjemahkan[teks]) return;
        sedangDiterjemahkan[teks] = true;

        var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=id&dt=t&q=' + encodeURIComponent(teks);

        fetch(url)
          .then(function(res) {
            if (!res.ok) throw new Error('Network error');
            return res.json();
          })
          .then(function(data) {
            if (data && data[0] && data[0][0] && data[0][0][0]) {
              var hasilTranslate = data[0][0][0];
              kamusGame[teks] = hasilTranslate;
              simpanKamusTranslate();
            }
            delete sedangDiterjemahkan[teks];
          })
          .catch(function(err) {
            isOfflineMode = true;
            delete sedangDiterjemahkan[teks];
          });
      }

      if (window.__dumpTimer) clearInterval(window.__dumpTimer);
      window.__dumpTimer = setInterval(paksaSaveDump, 500);
      
      window.addEventListener('beforeunload', paksaSaveDump);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') paksaSaveDump();
      });
      
      function prosesText(teks) {
        if (!teks || typeof teks !== 'string') return teks;
        var trimmed = teks.trim();
        
        if (trimmed === '' || trimmed.length <= 1 || /^\d+$/.test(trimmed)) return teks;
        
        if (kamusGame[trimmed] !== undefined) {
          if (dumpPending[trimmed]) delete dumpPending[trimmed];
          return teks.replace(trimmed, kamusGame[trimmed]);
        }
        
        for (var k in kamusGame) {
          if (kamusGame[k] === trimmed) return teks;
        }
        
        terjemahkanViaAPI(trimmed);

        if (autoSaveEnabled) {
          for (var key in dumpPending) {
            if (trimmed.length > key.length && trimmed.indexOf(key) !== -1) {
              delete dumpPending[key];
            }
          }
          
          var isSubText = false;
          for (var key in dumpPending) {
            if (key.length >= trimmed.length && key.indexOf(trimmed) !== -1) {
              isSubText = true;
              break;
            }
          }
          
          if (!isSubText) {
            dumpPending[trimmed] = trimmed;
            hasUnsavedDump = true;
          }
        }
        
        return teks;
      }
      
      if (typeof CanvasRenderingContext2D !== 'undefined') {
        var origFill = CanvasRenderingContext2D.prototype.fillText;
        CanvasRenderingContext2D.prototype.fillText = function(t, x, y, m) {
          var teksAsli = String(t);
          var tb = prosesText(teksAsli);
          var rx = Math.round(x);
          var ry = Math.round(y);
          
          // Simpan state asli
          this.save();
          
          // Dapatkan ukuran font dari properti yang ada
          var currentSize = this.font.match(/([0-9]+)px/);
          var fontSize = currentSize ? currentSize[1] : '13';
          
          // Set font normal untuk pengukuran
          this.font = fontSize + 'px Arial, sans-serif';
          
          // Jika teks diterjemahkan, skalakan agar muat
          if (tb !== teksAsli) {
            var widthAsli = this.measureText(teksAsli).width;
            var widthBaru = this.measureText(tb).width;
            
            if (widthBaru > widthAsli && widthBaru > 0) {
              var scaleX = widthAsli / widthBaru;
              
              this.translate(rx, ry);
              this.scale(scaleX, 1);
              
              // Set font bold untuk render
              this.font = 'bold ' + fontSize + 'px Arial, sans-serif';
              
              var res = m !== undefined ? origFill.call(this, tb, 0, 0, m) : origFill.call(this, tb, 0, 0);
              this.restore();
              return res;
            }
          }
          
          this.restore();
          
          // Set font bold untuk render normal
          this.font = 'bold ' + fontSize + 'px Arial, sans-serif';
          
          return m !== undefined ? origFill.call(this, tb, rx, ry, m) : origFill.call(this, tb, rx, ry);
        };
      }
      
      if (typeof Native !== 'undefined' && typeof J2ME !== 'undefined') {
        var sigDrawString = 'javax/microedition/lcdui/Graphics.drawString.(Ljava/lang/String;III)V';
        if (typeof Native[sigDrawString] === 'function') {
          var origDS = Native[sigDrawString];
          Native[sigDrawString] = function(addr, strAddr, x, y, anchor) {
            var str = J2ME.fromStringAddr(strAddr);
            var teksBaru = prosesText(str);
            return (teksBaru !== str) ? origDS.call(this, addr, J2ME.newString(teksBaru), x, y, anchor) : origDS.call(this, addr, strAddr, x, y, anchor);
          };
        }
      }
      
      if (typeof window.drawString === 'function') {
        var origWDS = window.drawString;
        window.drawString = function(info, str, x, y, anchor) {
          if (!str || typeof str !== 'string') return origWDS.call(this, info, str, x, y, anchor);
          var teksBaru = prosesText(str);
          if (teksBaru.indexOf('\n') !== -1) {
            var fontSize = 14;
            if (typeof NativeMap !== 'undefined' && info && info.currentFont) {
              var fc = NativeMap.get(info.currentFont);
              if (fc && fc.fontSize) fontSize = fc.fontSize;
            }
            var lh = fontSize * 1.6;  // Tambah line height dari 1.3 ke 1.6
            var baris = teksBaru.split('\n');
            for (var i = 0; i < baris.length; i++) {
              origWDS.call(this, info, baris[i], Math.round(x), Math.round(y + (i * lh)), anchor);
            }
            return;
          }
          return origWDS.call(this, info, teksBaru, Math.round(x), Math.round(y), anchor);
        };
      }
      
      (function() {
        if (document.getElementById('__toggle_btn')) return;
        var btn = document.createElement('button');
        btn.id = '__toggle_btn'; btn.textContent = '💾 ON';
        btn.style.cssText = 'position:fixed!important;bottom:10px!important;right:60px!important;z-index:999999!important;background:rgba(0,0,0,0.9)!important;color:#00ff88!important;border:2px solid #00ff88!important;border-radius:6px!important;padding:5px 10px!important;font-size:11px!important;font-weight:800!important;cursor:pointer!important;font-family:Arial,sans-serif!important;pointer-events:auto!important;box-shadow:0 0 10px rgba(0,255,136,0.5)!important;letter-spacing:0.3px!important;text-shadow:1px 1px 0 #000!important;word-spacing:2px!important';
        btn.onclick = function() { toggleSave(); };
        (document.body || document.documentElement).appendChild(btn);
      })();
      
      muatSemuaKamus();

      window.toggleSave = function() {
        autoSaveEnabled = !autoSaveEnabled;
        
        var btnFloat = document.getElementById('__toggle_btn');
        if (btnFloat) {
          btnFloat.textContent = autoSaveEnabled ? '💾 ON' : '💾 OFF';
          btnFloat.style.setProperty('color', autoSaveEnabled ? '#00ff88' : '#ff4444', 'important');
          btnFloat.style.setProperty('border-color', autoSaveEnabled ? '#00ff88' : '#ff4444', 'important');
          btnFloat.style.setProperty('box-shadow', autoSaveEnabled ? '0 0 10px rgba(0,255,136,0.5)' : '0 0 10px rgba(255,68,68,0.5)', 'important');
        }

        var saveBtn = document.querySelector('button[data-key="clear"]');
        if (saveBtn) {
          if (autoSaveEnabled) {
            saveBtn.classList.add('btn-save-active');
            saveBtn.classList.remove('btn-save-inactive');
          } else {
            saveBtn.classList.add('btn-save-inactive');
            saveBtn.classList.remove('btn-save-active');
          }
        }

        if (autoSaveEnabled) {
          paksaSaveDump();
        }
        return autoSaveEnabled;
      };

      window.__translator = {
        reload: function() { muatSemuaKamus(); },
        toggleSave: window.toggleSave,
        injectFont: injectArialBoldFont
      };
    })();

    function exitGame() {
      try {
        if (typeof myflushAll === 'function') {
          myflushAll();
        }
      } catch (err) {}
      window.location.href = 'index.html';
    }

    function triggerVictoryEffect(durationMs) {
      var duration = durationMs || 3500;
      var gamepad = document.getElementById('gamepad');
      if (!gamepad) return;

      gamepad.classList.add('victory-mode');

    window.addEventListener('DOMContentLoaded', function() {
      var canvas = document.getElementById('canvas');
      if (canvas) {
        canvas.setAttribute('tabindex', '0');
        setTimeout(function() { canvas.focus(); }, 500);
        var observer = new MutationObserver(function() {
          canvas.style.setProperty('width', '100%', 'important');
          canvas.style.setProperty('height', '100%', 'important');
        });
        observer.observe(canvas, { attributes: true, attributeFilter: ['width', 'height', 'style'] });
      }
      
      var exitBtn = document.getElementById('exit-btn');
      if (exitBtn) {
        exitBtn.addEventListener('click', exitGame);
      }

      var buttons = document.querySelectorAll('#gamepad button');
      buttons.forEach(function(btn) {
        btn.addEventListener('touchstart', function() { btn.classList.add('active-key'); }, {passive: true});
        btn.addEventListener('touchend', function() { btn.classList.remove('active-key'); }, {passive: true});
        btn.addEventListener('touchcancel', function() { btn.classList.remove('active-key'); }, {passive: true});
      });

      var saveBtn = document.querySelector('button[data-key="clear"]');
      if (saveBtn) {
        var dot = document.createElement('span');
        dot.className = 'save-indicator-dot';
        dot.style.cssText = 'display:inline-block;width:8px;height:8px;margin-left:4px;border-radius:50%;background:#00ff00;box-shadow:0 0 6px #00ff00, 0 0 12px rgba(0,255,0,0.5)';
        saveBtn.appendChild(dot);

        saveBtn.classList.add('btn-save-active');
        saveBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (typeof window.toggleSave === 'function') {
            window.toggleSave();
          }
        });
      }
    });
  </script>

  (function() {
      'use strict';

      const HEAP_START = 0x00001000;
      const HEAP_END = 0x03FFFFFF;

      let scanResults = [];
      let isFirstScan = true;
      let isScanning = false;
      let frozenList = new Map();
      let freezeIntervalId = null;
      let isFreezeMode = false;
      let currentFocus = 'scan';
      let scrollOffset = 0;

      const el = {
          editor: document.getElementById('memory-editor'),
          closeBtn: document.getElementById('me-close-btn'),
          canvas: document.getElementById('me-canvas'),
          scanValue: document.getElementById('me-scan-value'),
          btnFirstScan: document.getElementById('me-btn-first-scan'),
          btnNextScan: document.getElementById('me-btn-next-scan'),
          btnClear: document.getElementById('me-btn-clear'),
          btnInject: document.getElementById('me-btn-inject'),
          btnInjectAll: document.getElementById('me-btn-inject-all'),
          btnRefresh: document.getElementById('me-btn-refresh'),
          injectAddr: document.getElementById('me-inject-addr'),
          injectVal: document.getElementById('me-inject-val'),
          status: document.getElementById('me-status'),
          freezeToggle: document.getElementById('me-freeze-toggle'),
          freezeCount: document.getElementById('me-freeze-count'),
          btnUnfreezeAll: document.getElementById('me-btn-unfreeze-all'),
          btnOk: document.getElementById('btn-ok-emulator'),
          btnBack: document.getElementById('btn-back-emulator')
      };

      function toHex(addr) {
          return '0x' + addr.toString(16).toUpperCase().padStart(8, '0');
      }

      function isValidAddress(addr) {
          return addr >= HEAP_START && addr < HEAP_END && (addr & 3) === 0;
      }

      function readInt(addr) {
          if (!isValidAddress(addr) || typeof i32 === 'undefined') return null;
          try { return i32[addr >> 2]; } catch(e) { return null; }
      }

      function writeInt(addr, value) {
          if (!isValidAddress(addr) || typeof i32 === 'undefined') return false;
          try { i32[addr >> 2] = value; return true; } catch(e) { return false; }
      }

      function updateInputHighlight() {
          [el.scanValue, el.injectAddr, el.injectVal].forEach(function(inp) {
              if (!inp) return;
              inp.style.borderColor = '#1a2a3d';
              inp.style.boxShadow = 'none';
              inp.style.backgroundColor = '#050a12';
          });

          if (currentFocus === 'scan' && el.scanValue) {
              el.scanValue.style.borderColor = '#00e5ff';
              el.scanValue.style.boxShadow = '0 0 10px rgba(0, 229, 255, 0.2)';
              el.scanValue.style.backgroundColor = '#081020';
              try { el.scanValue.focus(); } catch(e) {}
          } else if (currentFocus === 'addr' && el.injectAddr) {
              el.injectAddr.style.borderColor = '#ff0055';
              el.injectAddr.style.boxShadow = '0 0 10px rgba(255, 0, 85, 0.2)';
              el.injectAddr.style.backgroundColor = '#201018';
              try { el.injectAddr.focus(); } catch(e) {}
          } else if (currentFocus === 'val' && el.injectVal) {
              el.injectVal.style.borderColor = '#ffcc00';
              el.injectVal.style.boxShadow = '0 0 10px rgba(255, 204, 0, 0.2)';
              el.injectVal.style.backgroundColor = '#201810';
              try { el.injectVal.focus(); } catch(e) {}
          }
      }

      function setFocus(target) {
          currentFocus = target;
          updateInputHighlight();
          var label = target === 'scan' ? 'SCAN' : target === 'addr' ? 'ADDR' : 'VALUE';
          setStatus('▶ ' + label, 'info');
      }

      function handleKeypadInput(key) {
          var targetInput = null;
          if (currentFocus === 'scan') targetInput = el.scanValue;
          else if (currentFocus === 'addr') targetInput = el.injectAddr;
          else if (currentFocus === 'val') targetInput = el.injectVal;
          if (!targetInput) return;

          if (key >= '0' && key <= '9') {
              targetInput.value += key;
          } else if (key === '*') {
              targetInput.value += 'A';
          } else if (key === '#') {
              targetInput.value += 'F';
          } else if (key === 'back' || key === 'Backspace') {
              targetInput.value = targetInput.value.slice(0, -1);
          } else if (key === 'ok' || key === 'Enter') {
              if (currentFocus === 'scan') {
                  if (scanResults.length === 0 || isFirstScan || el.btnNextScan.disabled) {
                      doFirstScan();
                  } else {
                      doNextScan();
                  }
              } else if (currentFocus === 'addr' || currentFocus === 'val') {
                  doInject();
              }
          } else if (key === 'clear') {
              targetInput.value = '';
          } else if (key === 'up') {
              scrollOffset = Math.max(0, scrollOffset - 1);
              renderResults(scanResults);
          } else if (key === 'down') {
              var maxLine = 12;
              var maxScroll = Math.max(0, scanResults.length - maxLine);
              scrollOffset = Math.min(maxScroll, scrollOffset + 1);
              renderResults(scanResults);
          } else if (key === 'left') {
              setFocus('scan');
          } else if (key === 'right') {
              setFocus('val');
          }
          
          updateInputHighlight();
      }

      function setStatus(msg, type) {
          if (!el.status) return;
          var colors = { success: '#00ff88', error: '#ff4444', info: '#64c8ff', inject: '#ff6b6b' };
          var cls = colors[type] ? type : 'info';
          el.status.innerHTML = '<span style="color:' + (colors[cls] || '#666') + '">' + msg + '</span>';
      }

      function updateFreezeCount() {
          if (!el.freezeCount) return;
          var count = frozenList.size;
          el.freezeCount.textContent = '(' + count + ')';
          el.freezeCount.style.color = count > 0 ? '#ff6b6b' : '#666';
      }

      function startFreezeLoop() {
          if (freezeIntervalId !== null) return;
          freezeIntervalId = setInterval(function() {
              for (var entry of frozenList) {
                  var addr = entry[0];
                  var data = entry[1];
                  if (isValidAddress(addr)) writeInt(addr, data.value);
              }
          }, 150);
      }

      function stopFreezeLoop() {
          if (freezeIntervalId !== null) {
              clearInterval(freezeIntervalId);
              freezeIntervalId = null;
          }
      }

      function toggleFreezeMode() {
          isFreezeMode = el.freezeToggle.checked;
          if (!isFreezeMode && frozenList.size > 0) {
              if (confirm('🔒 ' + frozenList.size + ' address(es) frozen.\nTurn off?')) {
                  unfreezeAll();
              } else {
                  el.freezeToggle.checked = true;
                  isFreezeMode = true;
              }
          }
          if (isFreezeMode && frozenList.size > 0) startFreezeLoop();
          else stopFreezeLoop();
          updateFreezeCount();
      }

      function freezeAddress(addr, value) {
          if (!isValidAddress(addr)) { setStatus('❌ Invalid address', 'error'); return false; }
          if (!frozenList.has(addr)) {
              var original = readInt(addr);
              frozenList.set(addr, { value: value, original: original });
          } else {
              var data = frozenList.get(addr);
              data.value = value;
          }
          writeInt(addr, value);
          updateFreezeCount();
          updateAllResults();
          if (isFreezeMode) startFreezeLoop();
          setStatus('🔒 Frozen ' + toHex(addr) + ' = ' + value, 'inject');
          return true;
      }

      function unfreezeAddress(addr) {
          if (!frozenList.has(addr)) { setStatus('❌ Not frozen', 'error'); return false; }
          var data = frozenList.get(addr);
          writeInt(addr, data.original);
          frozenList.delete(addr);
          updateFreezeCount();
          updateAllResults();
          if (frozenList.size === 0) stopFreezeLoop();
          setStatus('🔓 Unfrozen ' + toHex(addr), 'success');
          return true;
      }

      function unfreezeAll() {
          if (frozenList.size === 0) { setStatus('❌ Nothing frozen', 'error'); return; }
          for (var entry of frozenList) {
              var addr = entry[0];
              var data = entry[1];
              writeInt(addr, data.original);
          }
          var count = frozenList.size;
          frozenList.clear();
          stopFreezeLoop();
          updateFreezeCount();
          updateAllResults();
          setStatus('🔓 Unfrozen ' + count + ' address(es)', 'success');
      }

      function updateAllResults() {
          if (!scanResults || scanResults.length === 0) return;
          for (var i = 0; i < scanResults.length; i++) {
              var item = scanResults[i];
              var val = readInt(item.address);
              if (val !== null) item.value = val;
          }
          renderResults(scanResults);
      }

      function scanMemory(value) {
          var results = [];
          var numValue = parseInt(value);
          if (isNaN(numValue)) { setStatus('❌ Invalid number', 'error'); return results; }
          isScanning = true;
          var totalSteps = Math.floor((HEAP_END - HEAP_START) / 4);
          var step = 0, lastProgress = 0;
          for (var addr = HEAP_START; addr < HEAP_END; addr += 4) {
              var val = readInt(addr);
              if (val === null) continue;
              if (val === numValue) results.push({ address: addr, value: val });
              step++;
              if (step % 10000 === 0) {
                  var progress = Math.floor(step / totalSteps * 100);
                  if (progress > lastProgress) {
                      lastProgress = progress;
                      setStatus('⏳ Scanning... ' + progress + '% (' + results.length + ' found)', 'info');
                  }
              }
          }
          isScanning = false;
          return results;
      }

      function nextScan(value, previousResults) {
          if (!previousResults || previousResults.length === 0) {
              setStatus('❌ No previous results', 'error');
              return [];
          }
          var numValue = parseInt(value);
          if (isNaN(numValue)) { setStatus('❌ Invalid number', 'error'); return []; }
          var newResults = [];
          for (var i = 0; i < previousResults.length; i++) {
              var item = previousResults[i];
              var currentVal = readInt(item.address);
              if (currentVal === null) continue;
              if (currentVal === numValue) newResults.push({ address: item.address, value: currentVal });
          }
          return newResults;
      }

      function renderResultsToCanvas(results) {
          var canvas = el.canvas;
          if (!canvas) return;

          var rect = canvas.getBoundingClientRect();
          var dpr = 2;
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';

          var ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);

          var w = rect.width;
          var h = rect.height;

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#03060c';
          ctx.fillRect(0, 0, w, h);

          if (!results || results.length === 0) {
              ctx.fillStyle = '#334455';
              ctx.font = '10px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('🔍 MASUKKAN NILAI & KLIK FIRST', w / 2, h / 2);
              return;
          }

          ctx.fillStyle = '#445566';
          ctx.font = '8px monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('?? ' + results.length + ' address(es)', 4, 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#556677';
          ctx.fillText('KLIK UNTUK INJECT', w - 4, 2);

          var maxShow = 12;
          var y = 14;
          var lineHeight = 12;

          var maxScroll = Math.max(0, results.length - maxShow);
          if (scrollOffset > maxScroll) scrollOffset = maxScroll;
          if (scrollOffset < 0) scrollOffset = 0;

          var endIndex = Math.min(results.length, scrollOffset + maxShow);

          for (var i = scrollOffset; i < endIndex; i++) {
              var item = results[i];
              var addrHex = toHex(item.address);
              var hexVal = '0x' + (item.value >>> 0).toString(16).toUpperCase();
              var isFrozen = frozenList.has(item.address);

              if (isFrozen) {
                  ctx.fillStyle = 'rgba(255, 0, 85, 0.06)';
                  ctx.fillRect(0, y, w, lineHeight);
                  ctx.fillStyle = '#ff0055';
                  ctx.fillRect(0, y, 2, lineHeight);
              }

              ctx.textAlign = 'left';
              ctx.fillStyle = '#445566';
              ctx.font = '6px monospace';
              ctx.textBaseline = 'top';
              ctx.fillText('#' + i, 3, y + 1);

              ctx.textAlign = 'left';
              ctx.fillStyle = '#88bbdd';
              ctx.font = '7px monospace';
              ctx.fillText(addrHex, 22, y + 1);

              ctx.textAlign = 'right';
              ctx.fillStyle = '#00ff88';
              ctx.font = '7px monospace';
              ctx.fillText(item.value, w - 38, y + 1);

              ctx.textAlign = 'right';
              ctx.fillStyle = '#445566';
              ctx.font = '6px monospace';
              ctx.fillText(hexVal, w - 4, y + 2);

              if (isFrozen) {
                  ctx.textAlign = 'right';
                  ctx.fillStyle = '#ff6b6b';
                  ctx.font = '6px monospace';
                  ctx.fillText('🔒', w - 48, y + 1);
              }

              y += lineHeight;
          }

          if (results.length > maxShow) {
              ctx.textAlign = 'center';
              ctx.fillStyle = '#00e5ff';
              ctx.font = '7px monospace';
              ctx.fillText('📜 Scroll: ' + (scrollOffset + 1) + '-' + endIndex + ' / ' + results.length, w / 2, h - 10);
          }
      }

      function renderResults(results) {
          renderResultsToCanvas(results);
      }

      function doInject() {
          var addrStr = el.injectAddr.value.trim();
          var valStr = el.injectVal.value.trim();
          if (!addrStr || !valStr) { setStatus('❌ Masukkan alamat & nilai', 'error'); return; }
          var addr = addrStr.startsWith('0x') ? parseInt(addrStr, 16) : parseInt(addrStr);
          var val = parseInt(valStr);
          if (isNaN(addr) || isNaN(val)) { setStatus('❌ Invalid', 'error'); return; }
          if (!isValidAddress(addr)) { setStatus('❌ Address out of range', 'error'); return; }
          if (writeInt(addr, val)) {
              for (var i = 0; i < scanResults.length; i++) {
                  if (scanResults[i].address === addr) {
                      scanResults[i].value = val;
                      break;
                  }
              }
              if (isFreezeMode) {
                  freezeAddress(addr, val);
                  renderResults(scanResults);
                  setStatus('💉 INJECTED & 🔒 FROZEN ' + toHex(addr) + ' = ' + val + ' ✅', 'inject');
              } else {
                  renderResults(scanResults);
                  setStatus('💉 INJECTED ' + toHex(addr) + ' = ' + val + ' ✅', 'inject');
              }
          } else {
              setStatus('❌ Gagal inject', 'error');
          }
      }

      function doInjectAll() {
          if (!scanResults || scanResults.length === 0) { setStatus('❌ No results', 'error'); return; }
          var valStr = el.injectVal.value.trim();
          if (!valStr) { setStatus('❌ Masukkan nilai', 'error'); return; }
          var val = parseInt(valStr);
          if (isNaN(val)) { setStatus('❌ Invalid', 'error'); return; }
          var successCount = 0;
          for (var i = 0; i < scanResults.length; i++) {
              var item = scanResults[i];
              if (writeInt(item.address, val)) {
                  item.value = val;
                  successCount++;
                  if (isFreezeMode) {
                      if (!frozenList.has(item.address)) {
                          var original = readInt(item.address);
                          frozenList.set(item.address, { value: val, original: original });
                      } else {
                          var data = frozenList.get(item.address);
                          data.value = val;
                      }
                  }
              }
          }
          if (isFreezeMode && successCount > 0) {
              updateFreezeCount();
              if (isFreezeMode) startFreezeLoop();
          }
          renderResults(scanResults);
          setStatus('💉 INJECTED ' + successCount + ' address(es) = ' + val + ' ✅', 'inject');
      }

      function doRefresh() {
          if (!scanResults || scanResults.length === 0) { setStatus('❌ No results', 'error'); return; }
          updateAllResults();
          setStatus('⟳ Refreshed ' + scanResults.length + ' address(es)', 'info');
      }

      function doFirstScan() {
          if (isScanning) { setStatus('⏳ Scanning...', 'info'); return; }
          var value = el.scanValue.value.trim();
          if (!value) { setStatus('❌ Masukkan nilai', 'error'); setFocus('scan'); return; }
          if (typeof i32 === 'undefined') { setStatus('❌ J2ME not ready', 'error'); return; }
          isFirstScan = true;
          scrollOffset = 0;
          setStatus('⏳ Scanning...', 'info');
          setTimeout(function() {
              try {
                  var results = scanMemory(value);
                  scanResults = results;
                  renderResults(results);
                  el.btnNextScan.disabled = results.length === 0;
                  if (results.length === 0) setStatus('❌ Tidak ditemukan', 'error');
                  else if (results.length === 1) setStatus('🎯 Single address found!', 'success');
                  else setStatus('✅ Found ' + results.length + ' results', 'success');
              } catch(e) {
                  setStatus('❌ Error: ' + e.message, 'error');
                  console.error(e);
              }
          }, 50);
      }

      function doNextScan() {
          if (isScanning) { setStatus('⏳ Scanning...', 'info'); return; }
          if (!scanResults || scanResults.length === 0) { setStatus('❌ No previous results', 'error'); return; }
          var value = el.scanValue.value.trim();
          if (!value) { setStatus('❌ Masukkan nilai', 'error'); setFocus('scan'); return; }
          scrollOffset = 0;
          setStatus('⏳ Refining...', 'info');
          setTimeout(function() {
              try {
                  var results = nextScan(value, scanResults);
                  scanResults = results;
                  renderResults(results);
                  el.btnNextScan.disabled = results.length === 0;
                  if (results.length === 0) setStatus('❌ Tidak ada yang cocok', 'error');
                  else if (results.length === 1) setStatus('🎯 Single address found!', 'success');
                  else setStatus('✅ Refined: ' + results.length + ' results', 'success');
              } catch(e) {
                  setStatus('❌ Error: ' + e.message, 'error');
                  console.error(e);
              }
          }, 50);
      }

      function doClear() {
          scanResults = [];
          scrollOffset = 0;
          if (frozenList.size > 0) {
              if (confirm('🧹 Clear all including frozen?')) unfreezeAll();
          }
          renderResults([]);
          el.scanValue.value = '';
          el.injectAddr.value = '';
          el.injectVal.value = '';
          el.btnNextScan.disabled = true;
          isFirstScan = true;
          setStatus('🧹 Cleared', 'info');
          setFocus('scan');
      }

      function toggleEditor() {
          var isActive = el.editor.classList.toggle('active');
          if (isActive) {
              setTimeout(function() {
                  setFocus('scan');
                  renderResultsToCanvas(scanResults);
              }, 100);
          }
      }

      function setupCanvasClick() {
          var canvas = el.canvas;
          if (!canvas) return;

          canvas.addEventListener('click', function(e) {
              if (!scanResults || scanResults.length === 0) return;

              var rect = canvas.getBoundingClientRect();
              var y = (e.clientY - rect.top) / rect.height * rect.height;
              var lineHeight = 12;
              var startY = 14;
              var clickedRow = Math.floor((y - startY) / lineHeight);
              var index = scrollOffset + clickedRow;

              if (clickedRow >= 0 && index < scanResults.length) {
                  var item = scanResults[index];
                  el.injectAddr.value = toHex(item.address);
                  el.injectVal.value = item.value;
                  setFocus('val');
                  setStatus('📌 ' + toHex(item.address) + ' = ' + item.value, 'info');
              }
          });

          canvas.addEventListener('wheel', function(e) {
              e.preventDefault();
              if (e.deltaY > 0) {
                  var maxLine = 12;
                  var maxScroll = Math.max(0, scanResults.length - maxLine);
                  scrollOffset = Math.min(maxScroll, scrollOffset + 1);
              } else {
                  scrollOffset = Math.max(0, scrollOffset - 1);
              }
              renderResults(scanResults);
          }, { passive: false });

          var startYTouch = 0;
          canvas.addEventListener('touchstart', function(e) {
              if (e.touches.length === 1) {
                  startYTouch = e.touches[0].clientY;
              }
          }, { passive: true });

          canvas.addEventListener('touchmove', function(e) {
              if (e.touches.length === 1) {
                  var currentY = e.touches[0].clientY;
                  var diff = startYTouch - currentY;
                  if (Math.abs(diff) > 15) {
                      var maxLine = 12;
                      var maxScroll = Math.max(0, scanResults.length - maxLine);
                      if (diff > 0) {
                          scrollOffset = Math.min(maxScroll, scrollOffset + 1);
                      } else {
                          scrollOffset = Math.max(0, scrollOffset - 1);
                      }
                      startYTouch = currentY;
                      renderResults(scanResults);
                  }
              }
          }, { passive: true });
      }

      function waitForJ2ME() {
          var attempts = 0;
          var interval = setInterval(function() {
              attempts++;
              if (typeof i32 !== 'undefined' && typeof J2ME !== 'undefined') {
                  clearInterval(interval);
                  setStatus('✅ J2ME READY!', 'success');
                  el.btnFirstScan.disabled = false;
                  renderResults(scanResults);
              } else if (attempts >= 100) {
                  clearInterval(interval);
                  setStatus('⚠️ J2ME NOT DETECTED', 'error');
              } else if (attempts % 10 === 0) {
                  setStatus('⏳ WAITING J2ME... (' + Math.floor(attempts) + '%)', 'info');
              }
          }, 300);
      }

      function resizeCanvas() {
          if (el.canvas) {
              var rect = el.canvas.getBoundingClientRect();
              var dpr = 2;
              el.canvas.width = rect.width * dpr;
              el.canvas.height = rect.height * dpr;
              el.canvas.style.width = rect.width + 'px';
              el.canvas.style.height = rect.height + 'px';
              renderResultsToCanvas(scanResults);
          }
      }

      function setupKeypadNavigation() {
          var numButtons = document.querySelectorAll('.numpad button');
          
          numButtons.forEach(function(btn) {
              btn.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  var key = this.dataset.key;
                  handleKeypadInput(key);
              });
          });

          var navButtons = document.querySelectorAll('.nav-up, .nav-down, .nav-left, .nav-right');
          navButtons.forEach(function(btn) {
              btn.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  var key = this.dataset.key;
                  handleKeypadInput(key);
              });
          });

          if (el.btnOk) {
              el.btnOk.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  handleKeypadInput('ok');
              });
          }

          if (el.btnBack) {
              el.btnBack.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  handleKeypadInput('back');
              });
          }

          var clearBtn = document.querySelector('button[data-key="clear"]');
          if (clearBtn) {
              clearBtn.addEventListener('click', function(e) {
                  if (el.editor.classList.contains('active')) {
                      e.preventDefault();
                      e.stopPropagation();
                      handleKeypadInput('clear');
                  }
              });
          }

          document.addEventListener('keydown', function(e) {
              if (el.editor.classList.contains('active')) {
                  if (e.key >= '0' && e.key <= '9') {
                      e.preventDefault();
                      handleKeypadInput(e.key);
                  } else if (e.key === 'Enter' || e.key === 'ok') {
                      e.preventDefault();
                      handleKeypadInput('ok');
                  } else if (e.key === 'Backspace') {
                      e.preventDefault();
                      handleKeypadInput('back');
                  } else if (e.key === 'ArrowUp') {
                      e.preventDefault();
                      handleKeypadInput('up');
                  } else if (e.key === 'ArrowDown') {
                      e.preventDefault();
                      handleKeypadInput('down');
                  } else if (e.key === 'ArrowLeft') {
                      e.preventDefault();
                      handleKeypadInput('left');
                  } else if (e.key === 'ArrowRight') {
                      e.preventDefault();
                      handleKeypadInput('right');
                  }
              }
          });
      }

      function setup() {
          el.closeBtn.addEventListener('click', toggleEditor);

          var soft1Btn = document.getElementById('me-toggle-softkey');
          if (soft1Btn) {
              var triggerHandler = function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  toggleEditor();
              };
              soft1Btn.addEventListener('touchstart', triggerHandler, { capture: true });
              soft1Btn.addEventListener('mousedown', triggerHandler, { capture: true });
              soft1Btn.addEventListener('click', triggerHandler, { capture: true });
          }

          el.btnFirstScan.addEventListener('click', function(e) { e.preventDefault(); doFirstScan(); });
          el.btnNextScan.addEventListener('click', function(e) { e.preventDefault(); doNextScan(); });
          el.btnClear.addEventListener('click', function(e) { e.preventDefault(); doClear(); });
          el.btnInject.addEventListener('click', function(e) { e.preventDefault(); doInject(); });
          el.btnInjectAll.addEventListener('click', function(e) { e.preventDefault(); doInjectAll(); });
          el.btnRefresh.addEventListener('click', function(e) { e.preventDefault(); doRefresh(); });
          el.freezeToggle.addEventListener('change', toggleFreezeMode);
          el.btnUnfreezeAll.addEventListener('click', function(e) { e.preventDefault(); unfreezeAll(); });

          el.scanValue.addEventListener('click', function() { setFocus('scan'); });
          el.injectAddr.addEventListener('click', function() { setFocus('addr'); });
          el.injectVal.addEventListener('click', function() { setFocus('val'); });

          el.scanValue.addEventListener('input', function() { updateInputHighlight(); });
          el.injectAddr.addEventListener('input', function() { updateInputHighlight(); });
          el.injectVal.addEventListener('input', function() { updateInputHighlight(); });

          document.addEventListener('keydown', function(e) {
              if (e.ctrlKey && (e.key === 'm' || e.key === 'M')) {
                  e.preventDefault();
                  toggleEditor();
              }
              if (e.key === 'Escape' && el.editor.classList.contains('active')) toggleEditor();
          });

          el.btnNextScan.disabled = true;
          el.btnFirstScan.disabled = true;
          updateFreezeCount();

          setupCanvasClick();
          setupKeypadNavigation();

          window.addEventListener('resize', resizeCanvas);

          var observer = new MutationObserver(function() {
              if (el.editor.classList.contains('active')) {
                  setTimeout(resizeCanvas, 50);
              }
          });
          observer.observe(el.editor, { attributes: true, attributeFilter: ['class'] });

          waitForJ2ME();
      }

      window.MemoryInjector = {
          scan: doFirstScan,
          next: doNextScan,
          inject: doInject,
          injectAll: doInjectAll,
          refresh: doRefresh,
          clear: doClear,
          toggle: toggleEditor,
          freeze: freezeAddress,
          unfreeze: unfreezeAddress,
          unfreezeAll: unfreezeAll,
          results: function() { return scanResults; },
          frozen: function() { return Array.from(frozenList.keys()); },
          getValue: function(addr) { return readInt(addr); },
          setValue: function(addr, val) { return writeInt(addr, val); },
          render: function() { renderResults(scanResults); },
          focus: setFocus
      };

      if (document.readyState === 'complete') {
          setup();
      } else {
          document.addEventListener('DOMContentLoaded', setup);
      }

  })();
  </script>

  <script src="keymap.js"></script>
